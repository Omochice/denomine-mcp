name: build

# Called by both `ci` and `release` so the target matrix is defined once and a
# tag can never build a set the pull requests did not already exercise.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # The runner is chosen per target because the keyring cdylib has to be built
    # natively; `deno compile --target` would cross-compile from any host, but
    # cargo would not. The one exception is the Apple pair, where the arm64
    # runner's clang links either architecture, so both slices share a runner.
    #
    # `ext` exists because `deno compile` appends `.exe` for a Windows target.
    # Naming it in the matrix keeps the artifact path spelled out at each use
    # rather than depending on that behaviour implicitly.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            cdylib: libkeyring_ffi.dylib
            ext: ""
          - target: x86_64-apple-darwin
            runner: macos-latest
            cdylib: libkeyring_ffi.dylib
            ext: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cdylib: libkeyring_ffi.so
            ext: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cdylib: libkeyring_ffi.so
            ext: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cdylib: keyring_ffi.dll
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    # The staging step needs `mkdir -p` and `cp`, which the Windows runner's
    # default pwsh does not provide. Set once here so every step speaks the same
    # shell on every runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ADR-0005 counts CI cost as a decision driver, and the matrix now runs on
      # every pull request; without this each run pays for five cold builds of
      # the whole dependency tree.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ffi
          key: ${{ matrix.target }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Build the keyring cdylib
        run: >
          cargo build --release --locked
          --target ${{ matrix.target }}
          --manifest-path ffi/Cargo.toml

      # `src/keyring/ffi.ts` resolves exactly one path, `ffi/target/release/`,
      # and a `--target` build lands under `ffi/target/<triple>/release/`
      # instead. Staging the artifact keeps that single runtime path a contract
      # the builder satisfies, rather than teaching the loader about triples it
      # cannot know at runtime.
      - name: Stage the cdylib where the loader resolves it
        run: |
          mkdir -p ffi/target/release
          cp "ffi/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" ffi/target/release/

      # ADR-0005 made Windows distribution conditional on the Credential Manager
      # being verified, and this leg is the only place that can do it: it is
      # native, so the staged cdylib loads, and the Credential Manager answers
      # without a desktop session. The macOS legs are left out because a hosted
      # keychain smoke test would add a second thing to keep green for a store
      # the project already ships against.
      - name: Verify the Windows credential store
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          DENOMINE_KEYRING_SMOKE: "1"
        run: deno test --allow-read --allow-env --allow-ffi src/keyring/ffi.test.ts

      - name: Compile the single binary
        run: >
          deno compile
          --allow-ffi --allow-read --allow-write --allow-net --allow-env
          --target ${{ matrix.target }}
          --include ffi/target/release/${{ matrix.cdylib }}
          --output dist/denomine-mcp-${{ matrix.target }}${{ matrix.ext }}
          main.ts

      # Every leg but the Apple x64 one runs on a machine of its own
      # architecture; that one is cross-built on an arm64 runner with no Rosetta,
      # so its artifact cannot be executed here. `--help` is as far as this goes
      # because it proves the binary links and starts without depending on a
      # credential store the runner may not have.
      - name: Smoke-run the artifact
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./dist/denomine-mcp-${{ matrix.target }}${{ matrix.ext }} --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denomine-mcp-${{ matrix.target }}
          path: dist/denomine-mcp-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
