name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: deno fmt --check
      - run: deno lint
      - run: deno check main.ts

      # No cargo step: the FFI smoke test is gated behind
      # `DENOMINE_KEYRING_SMOKE`, so the default suite runs on the fakes and
      # needs no cdylib.
      - run: deno task test

  # The release matrix also runs here so a broken cross-build surfaces on the
  # pull request rather than at tag time, when the tag is already pushed.
  build:
    uses: ./.github/workflows/build.yml

  status-check:
    timeout-minutes: 5
    name: Status Check
    runs-on: ubuntu-latest
    needs:
      # keep-sorted start
      - build
      - check
      # keep-sorted end
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
