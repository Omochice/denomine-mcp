name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: deno fmt --check
      - run: deno lint
      - run: deno check main.ts

      # No cargo step: the FFI smoke test is gated behind
      # `DENOMINE_KEYRING_SMOKE`, so the default suite runs on the fakes and
      # needs no cdylib.
      - run: deno task test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: docker compose up -d

      - name: Wait for Redmine to answer
        run: |
          for _ in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              exit 0
            fi
            if [ -n "$(docker compose ps --status exited -q)" ]; then
              break
            fi
            sleep 5
          done
          echo "Redmine never answered on http://localhost:3000" >&2
          docker compose logs
          exit 1

      # `docker compose exec` runs outside the entrypoint that exports SECRET_KEY_BASE.
      - name: Enable the REST API and capture the admin API key
        run: |
          key=$(docker compose exec -T redmine sh -c \
            'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner \
             "Setting.rest_api_enabled = %q(1); puts User.find_by_login(%q(admin)).api_key"' \
            | tail -n 1)
          if [ -z "$key" ]; then
            echo "rails runner produced no API key" >&2
            docker compose logs redmine
            exit 1
          fi
          echo "::add-mask::$key"
          echo "DENOMINE_TEST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Seed the default data and the project under test
        run: |
          docker compose exec -T redmine sh -c \
            'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" REDMINE_LANG=en bundle exec rake redmine:load_default_data'
          id=$(curl -sS --fail-with-body -X POST \
            -H "X-Redmine-API-Key: $DENOMINE_TEST_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"project":{"name":"Demo","identifier":"demo"}}' \
            http://localhost:3000/projects.json | jq -r .project.id)
          if ! [ "$id" -gt 0 ] 2>/dev/null; then
            echo "project creation returned no id" >&2
            exit 1
          fi
          echo "DENOMINE_TEST_PROJECT_ID=$id" >> "$GITHUB_ENV"

      - name: Run the integration tests
        env:
          DENOMINE_TEST_ENDPOINT: http://localhost:3000
          DENOMINE_TEST_PROJECT_IDENTIFIER: demo
          DENOMINE_TEST_SEARCH_QUERY: Demo
        run: deno task test:integration

  # The release matrix also runs here so a broken cross-build surfaces on the
  # pull request rather than at tag time, when the tag is already pushed.
  build:
    uses: ./.github/workflows/build.yml

  status-check:
    timeout-minutes: 5
    name: Status Check
    runs-on: ubuntu-latest
    needs:
      # keep-sorted start
      - build
      - check
      - integration
      # keep-sorted end
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
