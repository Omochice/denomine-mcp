name: release

# Not tag-triggered. release-please cuts the tag with the default GITHUB_TOKEN,
# and a tag pushed by that token starts no further workflow, so a tag-triggered
# build would never run. Building in the same run that cut the release is what
# keeps a published binary tied to a tagged commit.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Only the merge of a release pull request gets this far; every other push to
  # main stops at the job above, which just refreshes the pending release PR.
  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One combined file rather than a checksum per asset, so a verifier needs
      # a single download regardless of which binary it fetched.
      - name: Checksum every binary
        working-directory: dist
        run: sha256sum denomine-mcp-* > SHA256SUMS

      # Uploading to the release release-please already created, rather than
      # creating one here: the changelog and the tag are its output, and this
      # job only adds what it could not build.
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag }}" dist/*
          --repo "$GITHUB_REPOSITORY"
