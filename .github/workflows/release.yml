name: release

# Tag-triggered so every published binary is traceable to a tagged commit
# (ADR-0005).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One combined file rather than a checksum per asset, so a verifier needs
      # a single download regardless of which binary it fetched.
      - name: Checksum every binary
        working-directory: dist
        run: sha256sum denomine-mcp-* > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
