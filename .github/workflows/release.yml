name: release

# Not tag-triggered. The tag is created with the default GITHUB_TOKEN, and a tag
# pushed by that token starts no further workflow, so a tag-triggered build would
# never run. Building in the same run that cuts the release is what keeps a
# published binary tied to a tagged commit.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # Only the merge of a release pull request gets this far; every other push to
  # main stops at the job above, which just refreshes the pending release PR.
  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One combined file rather than a checksum per asset, so a verifier needs
      # a single download regardless of which binary it fetched.
      - name: Checksum every binary
        working-directory: dist
        run: sha256sum denomine-mcp-* > SHA256SUMS

      # Uploading to the release release-please already created, rather than
      # creating one here: the changelog is its output, and this job only adds
      # what it could not build.
      #
      # `release_immutability` is enabled on this repository, and a published
      # immutable release rejects every asset upload. Attaching while the release
      # is still a draft is the way in GitHub documents, which is why
      # release-please is configured to draft it rather than publish it.
      - name: Attach the binaries to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag }}" dist/*
          --repo "$GITHUB_REPOSITORY"

      # Publishing is what freezes the release, so nothing may follow it. The tag
      # comes into existence here too: GitHub withholds it while a release is a
      # draft, then creates it at the commit release-please recorded.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release edit "${{ needs.release-please.outputs.tag }}" --draft=false
          --repo "$GITHUB_REPOSITORY"
